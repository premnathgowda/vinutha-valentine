<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinutha & My Love Story ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to bottom right, #ff9a9e, #fad0c4);
    color: white;
    text-align: center;
    padding: 20px;
    overflow-x: hidden;
}

h1 {
    font-size: 2.5em;
}

#storyBox {
    background: rgba(255,255,255,0.2);
    padding: 30px;
    border-radius: 20px;
    max-width: 500px;
    margin: 30px auto;
    transition: opacity 0.6s ease, transform 0.6s ease;
}

.fade-out {
    opacity: 0;
    transform: translateY(10px);
}

.fade-in {
    opacity: 1;
    transform: translateY(0);
}

button {
    display: block;
    width: 80%;
    margin: 10px auto;
    padding: 12px;
    border: none;
    border-radius: 25px;
    background: #ff4e8a;
    color: white;
    font-size: 1em;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff2e6f;
    transform: scale(1.05);
}

/* Floating hearts */
.heart {
    position: fixed;
    font-size: 20px;
    animation: floatUp 5s linear infinite;
}

@keyframes floatUp {
    0% {transform: translateY(100vh); opacity: 1;}
    100% {transform: translateY(-10vh); opacity: 0;}
}

@keyframes slowZoom {
    from {
        transform: scale(1);
    }
    to {
        transform: scale(1.08);
    }
}

.zoom-effect {
    animation: slowZoom 8s ease-in-out forwards;
}
.slideshow-container {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
    z-index: -1;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.slide.active {
    opacity: 0.7; /* slightly transparent so text is readable */
}

</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<h1>Vinutha & Our Love Story ❤️</h1>
<p>Choose your romantic destiny, my love 💕</p>

<div id="storyBox" class="fade-in">
    <p id="storyText"></p>
    <div id="choices"></div>
</div>

<script>

// Start music after first user interaction
document.addEventListener("click", function startMusic() {
    const music = document.getElementById("bgMusic");
    music.play();
    document.removeEventListener("click", startMusic);
});

// Floating background hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}, 500);

const story = [
    {
        text: "It’s Valentine’s evening. You see me waiting for you with a smile. What do you do?",
        options: [
            { text: "💌 Sit next to you", next: 1 },
            { text: "📱 Check phone instead", next: -1 }
        ]
    },
    {
        text: "We sit close. The night feels magical. I gently hold your hand. What happens next?",
        options: [
            { text: "🌙 Go for a moonlight walk", next: 2 },
            { text: "🏃 Run away playfully", next: -1 }
        ]
    },
    {
        text: "Under the stars, we stop and look into each other's eyes. The moment feels intense.",
        options: [
            { text: "💋 Lean in closer", next: 3 },
            { text: "😅 Start laughing nervously", next: -1 }
        ]
    },
    {
        text: "Our faces are inches apart. The world disappears. You can feel the chemistry between us...",
        options: [
            { text: "😏 Let the chemistry react", next: 4 }
        ]
    }
];

function changeScene(index) {
    const box = document.getElementById("storyBox");
    box.classList.remove("fade-in");
    box.classList.add("fade-out");

    setTimeout(() => {
        startStory(index);
        box.classList.remove("fade-out");
        box.classList.add("fade-in");
    }, 500);
}

function startStory(index) {
    if (index === -1) {
        document.getElementById("storyText").innerHTML =
            "Oh nooo 😘 That wasn’t very romantic. Try again, my love!";
        document.getElementById("choices").innerHTML =
            `<button onclick="changeScene(0)">Restart Our Love Story ❤️</button>`;
        return;
    }

    if (index === 4) {
        showFinalScreen();
        return;
    }

    const scene = story[index];
    document.getElementById("storyText").innerHTML = scene.text;

    const choicesDiv = document.getElementById("choices");
    choicesDiv.innerHTML = "";

    scene.options.forEach(option => {
        const btn = document.createElement("button");
        btn.innerHTML = option.text;
        btn.onclick = () => changeScene(option.next);
        choicesDiv.appendChild(btn);
    });
}

function showFinalScreen() {

    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.background = "transparent";
    overlay.style.display = "flex";
    overlay.style.flexDirection = "column";
    overlay.style.justifyContent = "center";
    overlay.style.alignItems = "center";
    overlay.style.textAlign = "center";
    overlay.style.padding = "20px";
    overlay.style.zIndex = "9999";
    overlay.style.color = "white";
    overlay.style.overflow = "hidden";

    overlay.innerHTML = `
    <div class="slideshow-container">
        <img src="Photo1.jpeg" class="slide active">
        <img src="Photo2.jpeg" class="slide">
        <img src="Photo3.jpeg" class="slide">
        <img src="Photo4.jpeg" class="slide">
        <img src="Photo5.jpeg" class="slide">
        <img src="Photo6.jpeg" class="slide">
        <img src="Photo7.jpeg" class="slide">
        <img src="Photo8.jpeg" class="slide">
        <img src="Photo9.jpeg" class="slide">
    </div>

    <div id="finalMessage" class="zoom-effect">
        <h1>You Completed Our Love Story 💕</h1>
        <p><strong>Vinutha, are you made of copper and tellurium?</strong></p>
        <p>Because you’re <strong>Cu-Te</strong>…</p>
        <p>and honestly, I wouldn’t mind conducting a little chemistry experiment with you tonight. 😏💋</p>
        <br>
        <h2>Happy Valentine’s Day, Vinutha ❤️</h2>
        <p>You are my favorite person, my happiness, and my forever. 💖</p>
        <button onclick="location.reload()">Play Again ❤️</button>
    </div>
`;

    document.body.appendChild(overlay);

    startSlideshow();
    startConfetti();
    startFireworks();
}

function startSlideshow() {
    const slides = document.querySelectorAll(".slide");
    let current = 0;

    setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
    }, 3500);
}



function startConfetti() {
    for (let i = 0; i < 120; i++) {
        createConfettiPiece();
    }
}

function createConfettiPiece() {
    const confetti = document.createElement("div");
    confetti.style.position = "fixed";
    confetti.style.width = "8px";
    confetti.style.height = "8px";
    confetti.style.backgroundColor = getRandomColor();
    confetti.style.top = "-10px";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.zIndex = "10000";
    document.body.appendChild(confetti);

    let fallSpeed = Math.random() * 3 + 2;

    let fall = setInterval(() => {
        let top = parseFloat(confetti.style.top);
        if (top > window.innerHeight) {
            clearInterval(fall);
            confetti.remove();
        } else {
            confetti.style.top = top + fallSpeed + "px";
        }
    }, 20);
}

function startFireworks() {
    setInterval(() => {
        createFirework();
    }, 800);
}

function createFirework() {
    const firework = document.createElement("div");
    firework.style.position = "fixed";
    firework.style.width = "6px";
    firework.style.height = "6px";
    firework.style.borderRadius = "50%";
    firework.style.background = getRandomColor();
    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 50 + "vh";
    firework.style.zIndex = "10000";
    document.body.appendChild(firework);

    for (let i = 0; i < 20; i++) {
        const spark = document.createElement("div");
        spark.style.position = "fixed";
        spark.style.width = "4px";
        spark.style.height = "4px";
        spark.style.borderRadius = "50%";
        spark.style.background = getRandomColor();
        spark.style.left = firework.style.left;
        spark.style.top = firework.style.top;
        spark.style.zIndex = "10000";
        document.body.appendChild(spark);

        const angle = Math.random() * 2 * Math.PI;
        const distance = Math.random() * 100 + 50;

        let start = 0;
        const animate = setInterval(() => {
            start += 5;
            spark.style.left = 
                parseFloat(firework.style.left) + Math.cos(angle) * start + "px";
            spark.style.top = 
                parseFloat(firework.style.top) + Math.sin(angle) * start + "px";
            spark.style.opacity = 1 - start / distance;

            if (start >= distance) {
                clearInterval(animate);
                spark.remove();
            }
        }, 20);
    }

    setTimeout(() => firework.remove(), 100);
}


function getRandomColor() {
    const colors = ["#ff4e8a", "#ffffff", "#ffd700", "#ff9a9e", "#ff2e6f"];
    return colors[Math.floor(Math.random() * colors.length)];
}


// Start story
startStory(0);

</script>

</body>
</html>
